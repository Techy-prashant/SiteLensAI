services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sitelens-postgres
    environment:
      POSTGRES_DB: sitelens
      POSTGRES_USER: sitelens
      POSTGRES_PASSWORD: sitelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitelens -d sitelens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sitelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
